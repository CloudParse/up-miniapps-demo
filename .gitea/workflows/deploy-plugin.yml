# Deploys the backoffice plugin to production: builds <plugin.dir>, publishes the ES module <plugin.out>/<plugin.file> as the active
# plugin version with an empty changelog. The organisation API keeps the 5 newest versions itself.
# Started by its button of the platform (workflow_dispatch), which picks the version.
# Secret written by the platform: UP_API_URL. The mini-app has NO secret in this repository: the publish step gives the platform the token of
# its own job (gitea.token), and the platform checks it with Gitea.
# Do not change or delete this file (AGENT.md section 5.1): without its section in miniapp.yaml it ends green and builds nothing.
# Security model: docs/deploy.md. A writer of this repository can edit this file and read these secrets; the limits are on
# the platform side (15-minute session, one mini-app, no delete right).
name: deploy-plugin
# The title of the run ends with the version: the platform reads the version of a run from it.
run-name: deploy-plugin ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver of this deployment, e.g. 1.0.3
        required: true

# The job token (gitea.token) lives only while its job runs and reads only this repository (checked on Gitea 1.27, 2026-11-20).
# The platform gives the session to the job named `deploy-plugin` of this workflow on the default branch, and to no other job.
permissions:
  contents: read

concurrency:
  group: deploy-plugin
  cancel-in-progress: false

jobs:
  deploy-plugin:
    runs-on: up-ci
    steps:
      # First step: nothing else runs on a version that is not a plain semver.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "the version must be a plain semver such as 1.2.3" >&2
            exit 1
          fi

      # The commit built is gitea.sha: the head of the branch the platform dispatched on (the default branch), as it is when
      # this run starts. miniapp.yaml is read from that same checkout, and it is the copy that decides what is built.
      - name: Check out the repository
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          COMMIT: ${{ gitea.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # CI_GITEA_URL is the in-cluster address of Gitea, set by the runner of the organisation.
          git_url="${CI_GITEA_URL:-$SERVER_URL}"
          askpass="$(mktemp)"; printf '#!/bin/sh\necho "$GITEA_TOKEN"\n' >"$askpass"; chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "${git_url%/}/$REPOSITORY.git" src
          rm -f "$askpass"
          git -C src checkout --quiet "$COMMIT"

      # An invalid miniapp.yaml FAILS this step. An absent section is not an error: the run says so once and the steps
      # below are skipped (a mini-app may have no api, no miniapp or no plugin).
      - name: Read miniapp.yaml
        id: plan
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          plan="$(python3 .gitea/scripts/miniapp_config.py plan --target plugin)"
          if [[ "$plan" == skip* ]]; then
            echo "::notice::${plan#skip }"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build the plugin
        if: steps.plan.outputs.skip != 'true'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          .gitea/scripts/run-build.sh plugin

      - name: Pack the bundle
        id: pack
        if: steps.plan.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          file="$(python3 .gitea/scripts/bundle.py plugin --version "$VERSION" --out dist-ci)"
          echo "file=$file" >>"$GITHUB_OUTPUT"

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        working-directory: src
        env:
          UP_API_URL: ${{ secrets.UP_API_URL }}
          # the token of THIS job: Gitea made it, it dies with the job and opens this repository only
          UP_JOB_TOKEN: ${{ gitea.token }}
          UP_REPOSITORY: ${{ gitea.repository }}
          VERSION: ${{ inputs.version }}
          PLUGIN_FILE: ${{ steps.pack.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .gitea/scripts/up_api.py publish plugin --version "$VERSION" --file "$PLUGIN_FILE"
