# Deploys the API of the mini-app to production: builds <api.dir> into an image, pushes it to this organisation's Gitea
# registry and rolls out the custom component linked to the mini-app.
# Started by its button of the platform (workflow_dispatch), which picks the version.
# Secrets written by the platform: UP_API_URL, UP_CLIENT_ID, UP_CLIENT_SECRET, REGISTRY_USER, REGISTRY_TOKEN.
# You may delete this file when your mini-app has no such part; the platform then shows no button for it.
name: deploy-backend

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver of this deployment, e.g. 1.0.3
        required: true

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: up-ci
    steps:
      - name: Check out the repository
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          COMMIT: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          askpass="$(mktemp)"; printf '#!/bin/sh\necho "$GITEA_TOKEN"\n' >"$askpass"; chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "$SERVER_URL/$REPOSITORY.git" src
          rm -f "$askpass"
          git -C src checkout --quiet "$COMMIT"

      # A mini-app may have no api, no miniapp or no plugin section: the run then ends successfully, building nothing.
      - name: Read miniapp.yaml
        working-directory: src
        run: |
          set -euo pipefail
          plan="$(python3 .gitea/scripts/miniapp_config.py plan --target backend)"
          case "$plan" in
            skip*) echo "::notice::${plan#skip }"; echo "${plan#skip }"; : >.ci-skip ;;
          esac

      - name: Build and push the image
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [ -f .ci-skip ]; then echo "skipped: nothing to deploy"; exit 0; fi
          host="${SERVER_URL#*://}"; host="${host%%/*}"
          export IMAGE="$(printf '%s/%s' "$host" "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          export API_DIR="$(python3 .gitea/scripts/miniapp_config.py get api.dir)"
          export API_PORT="$(python3 .gitea/scripts/miniapp_config.py get api.port)"
          if [ "${SERVER_URL%%://*}" = "http" ]; then export REGISTRY_INSECURE=true; fi
          .gitea/scripts/build-image.sh

      - name: Roll out the component
        working-directory: src
        env:
          UP_API_URL: ${{ secrets.UP_API_URL }}
          UP_CLIENT_ID: ${{ secrets.UP_CLIENT_ID }}
          UP_CLIENT_SECRET: ${{ secrets.UP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -f .ci-skip ]; then echo "skipped: nothing to deploy"; exit 0; fi
          python3 .gitea/scripts/up_api.py deploy-component

      - name: Keep only this image
        working-directory: src
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ gitea.repository_owner }}
          REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          if [ -f .ci-skip ]; then echo "skipped: nothing to deploy"; exit 0; fi
          python3 .gitea/scripts/registry_prune.py --owner "$OWNER" --name "${REPOSITORY#*/}" --keep-version "$VERSION"
