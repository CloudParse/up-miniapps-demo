# Deploys the API of the mini-app to production: builds <api.dir> into an image, pushes it to this organisation's Gitea
# registry and asks the platform to deploy that version on the custom component linked to the mini-app. The platform deletes
# the old images itself: this workflow never changes the component, it only pushes and then calls deploy with the tag.
# TWO JOBS, on purpose: Kaniko unpacks the last stage of your Dockerfile over the file system of the runner container, so a step
# after it in the same job would find the tools of YOUR image (no bash with an Alpine image). The runner container is restarted
# between two jobs. `build` ends with Kaniko; `release` then calls the platform. A side effect: the steps that run your Dockerfile
# are not given the job token of the platform call, and `release` is not given REGISTRY_TOKEN (see docs/deploy.md: a limit on what a
# step receives, not a sandbox).
# Started by its button of the platform (workflow_dispatch), which picks the version.
# Secrets written by the platform: UP_API_URL, REGISTRY_USER, REGISTRY_TOKEN. The mini-app has NO secret in this repository: the release step
# gives the platform the token of its own job (gitea.token), and the platform checks it with Gitea. Each value is read by the one step that needs it.
# You may delete this file when your mini-app has no such part; the platform then shows no button for it.
# Security model: docs/deploy.md. A writer of this repository can edit this file and read these secrets; the limits are on
# the platform side (15-minute session, one mini-app, no delete right).
name: deploy-backend
# The title of the run ends with the version: the platform reads the version of a run from it.
run-name: deploy-backend ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver of this deployment, e.g. 1.0.3
        required: true

# The job token only reads this repository. Gitea Actions reads this key since 1.24 (not verified on the version in use: the scripts
# never use gitea.token beyond the clone step either way).
permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    runs-on: up-ci
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      # First step: nothing else runs on a version that is not a plain semver.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "the version must be a plain semver such as 1.2.3" >&2
            exit 1
          fi

      # The commit built is gitea.sha: the head of the branch the platform dispatched on (the default branch), as it is when
      # this run starts. miniapp.yaml is read from that same checkout, and it is the copy that decides what is built.
      - name: Check out the repository
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          COMMIT: ${{ gitea.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # CI_GITEA_URL is the in-cluster address of Gitea, set by the runner of the organisation.
          git_url="${CI_GITEA_URL:-$SERVER_URL}"
          askpass="$(mktemp)"; printf '#!/bin/sh\necho "$GITEA_TOKEN"\n' >"$askpass"; chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "${git_url%/}/$REPOSITORY.git" src
          rm -f "$askpass"
          git -C src checkout --quiet "$COMMIT"

      # An invalid miniapp.yaml FAILS this step. An absent section is not an error: the run says so once and the steps
      # below are skipped (a mini-app may have no api, no miniapp or no plugin).
      - name: Read miniapp.yaml
        id: plan
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          plan="$(python3 .gitea/scripts/miniapp_config.py plan --target backend)"
          if [[ "$plan" == skip* ]]; then
            echo "::notice::${plan#skip }"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      # LAST step of the job: Kaniko replaces the file system of this container, nothing runs after it.
      - name: Build and push the image
        if: steps.plan.outputs.skip != 'true'
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REPOSITORY: ${{ gitea.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # CI_REGISTRY_HOST and CI_REGISTRY_INSECURE come from the runner of the organisation. No fallback: a missing host fails.
          export REGISTRY_HOST="${CI_REGISTRY_HOST:?CI_REGISTRY_HOST is not set on this runner}"
          export REGISTRY_INSECURE="${CI_REGISTRY_INSECURE:-false}"
          API_DIR="$(python3 .gitea/scripts/miniapp_config.py get api.dir)"
          API_PORT="$(python3 .gitea/scripts/miniapp_config.py get api.port)"
          export API_DIR API_PORT
          .gitea/scripts/build-image.sh

  # Last call, after the push: the platform sets the component's tag to this version only when the registry holds it.
  # A new job, so a fresh runner container with its own tools.
  release:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: up-ci
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "the version must be a plain semver such as 1.2.3" >&2
            exit 1
          fi

      - name: Check out the repository
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          COMMIT: ${{ gitea.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git_url="${CI_GITEA_URL:-$SERVER_URL}"
          askpass="$(mktemp)"; printf '#!/bin/sh\necho "$GITEA_TOKEN"\n' >"$askpass"; chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "${git_url%/}/$REPOSITORY.git" src
          rm -f "$askpass"
          git -C src checkout --quiet "$COMMIT"

      - name: Deploy the component
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          UP_API_URL: ${{ secrets.UP_API_URL }}
          # the token of THIS job: Gitea made it, it dies with the job and opens this repository only
          UP_JOB_TOKEN: ${{ gitea.token }}
          UP_REPOSITORY: ${{ gitea.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .gitea/scripts/up_api.py deploy-component --version "$VERSION"
