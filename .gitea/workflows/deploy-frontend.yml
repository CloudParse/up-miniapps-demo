# Deploys the mini-app bundle to production: builds <miniapp.dir>, packs the content of <miniapp.out> as a .tar.gz and publishes it
# with the new version and an empty changelog. The organisation API keeps the 5 newest versions itself.
# Started by its button of the platform (workflow_dispatch), which picks the version.
# Secrets written by the platform: UP_API_URL, UP_CLIENT_ID, UP_CLIENT_SECRET.
# You may delete this file when your mini-app has no such part; the platform then shows no button for it.
name: deploy-frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver of this deployment, e.g. 1.0.3
        required: true

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: up-ci
    steps:
      - name: Check out the repository
        env:
          GITEA_TOKEN: ${{ gitea.token }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          COMMIT: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          # CI_GITEA_URL is the in-cluster address of Gitea, set by the runner of the organisation.
          git_url="${CI_GITEA_URL:-$SERVER_URL}"
          askpass="$(mktemp)"; printf '#!/bin/sh\necho "$GITEA_TOKEN"\n' >"$askpass"; chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet "${git_url%/}/$REPOSITORY.git" src
          rm -f "$askpass"
          git -C src checkout --quiet "$COMMIT"

      # A mini-app may have no api, no miniapp or no plugin section: the run then ends successfully, building nothing.
      - name: Read miniapp.yaml
        working-directory: src
        run: |
          set -euo pipefail
          plan="$(python3 .gitea/scripts/miniapp_config.py plan --target frontend)"
          case "$plan" in
            skip*) echo "::notice::${plan#skip }"; echo "${plan#skip }"; : >.ci-skip ;;
          esac

      # The build step gets no secret: the build command comes from the repository.
      - name: Build the miniapp
        working-directory: src
        run: |
          set -euo pipefail
          if [ -f .ci-skip ]; then echo "skipped: nothing to deploy"; exit 0; fi
          py="$PWD/.gitea/scripts/miniapp_config.py"
          build="$(python3 "$py" get miniapp.build)"
          cd "$(python3 "$py" get miniapp.dir)"
          sh -c "$build"

      - name: Pack the bundle
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -f .ci-skip ]; then echo "skipped: nothing to deploy"; exit 0; fi
          python3 .gitea/scripts/bundle.py miniapp --version "$VERSION" --out dist-ci

      - name: Publish
        working-directory: src
        env:
          UP_API_URL: ${{ secrets.UP_API_URL }}
          UP_CLIENT_ID: ${{ secrets.UP_CLIENT_ID }}
          UP_CLIENT_SECRET: ${{ secrets.UP_CLIENT_SECRET }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -f .ci-skip ]; then echo "skipped: nothing to deploy"; exit 0; fi
          file="$(ls dist-ci/miniapp-"$VERSION".tar.gz)"
          python3 .gitea/scripts/up_api.py publish miniapp --version "$VERSION" --file "$file"
