# Local development environment for a mini-app: the CloudParse (Hub) backend and
# the infrastructure it needs. Your own mini-app backend and frontend run on the
# host (see backend/AGENT.md and frontend/AGENT.md), so they hot-reload.
#
#   scripts/generate-keys.sh && docker compose up
#
# Every port is published on 127.0.0.1 only and lives in the 21509-21515 block,
# chosen to avoid the usual 5432 / 6379 / 8080 / 9000 clashes.
name: up-miniapps-demo

services:
  postgres:
    # PostgreSQL 18, the version the platform runs. The image keeps its data in
    # /var/lib/postgresql/18/docker, so the volume is mounted at /var/lib/postgresql.
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-21510}:5432"
    volumes:
      - postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache:
    # Valkey, the open source Redis-compatible cache the platform runs (it cannot read Redis 7.4 data files: new volume).
    image: valkey/valkey:9.1.3-alpine
    ports:
      - "127.0.0.1:${CACHE_PORT:-21511}:6379"
    volumes:
      - cache-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    # S3-compatible object storage (RustFS), the Hub's storage backend.
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-password123}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-21512}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-21513}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cloudparse-backend:
    # The official Up backend (the "Hub"). Docker Hub only publishes commit-SHA
    # tags for now and the image is amd64-only, hence the pinned platform.
    image: cloudparse/up-backend:${UP_BACKEND_TAG:-74cc3a6a}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # Each variable overrides the key of the same name in the image's
      # configs/config.toml (dotted key, upper-cased, dots -> underscores).
      ENVIRONMENT: development
      SERVER_BASE_URL: http://localhost:${CLOUDPARSE_BACKEND_PORT:-21509}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      CACHE_URL: redis://cache:6379/0
      STORAGE_ENDPOINT: rustfs:9000
      STORAGE_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      STORAGE_SECRET_KEY: ${RUSTFS_SECRET_KEY:-password123}
      STORAGE_PUBLIC_URL: http://localhost:${RUSTFS_API_PORT:-21512}
      STORAGE_USE_SSL: "false"
      # Local sign-in without an SMS provider: any phone number, OTP code 999999.
      # Honoured only while ENVIRONMENT=development. NEVER enable outside local dev.
      TESTING_ALLOW_DEV_AUTH_BYPASS: "true"
      # The image ships a placeholder SMS key; replace it so it is never used.
      PRELUDE_API_KEY: unused-in-local-development
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:${CLOUDPARSE_BACKEND_PORT:-21509}:8080"
    healthcheck:
      # The image has no curl: busybox wget, on the Hub's readiness route (503 while the database is down).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-18:
  cache-valkey:
  rustfs-data:
