[project]
name = "up-miniapps-demo-api"
version = "0.1.0"
description = "Demo FastAPI API for an Up mini-app."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "httpx2>=2.13",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# An application, not a library: nothing to build or publish.
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S", "ANN", "C90", "RET"]

[tool.ruff.lint.per-file-ignores]
# Asserts and missing annotations on fixtures are idiomatic in tests.
"tests/**" = ["S101", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
