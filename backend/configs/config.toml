# Every key can be overridden by an environment variable: the dotted key,
# upper-cased, with dots replaced by underscores (hub.base_url -> HUB_BASE_URL).
# `environment` is deliberately top-level so it maps to a plain ENVIRONMENT.
# Secrets never live here: real values come from the environment (backend/.env).
environment = "development"

[server]
host = "127.0.0.1"
port = 21514

[hub]
# The CloudParse backend (the "Hub"): the organisation's DEV backend, as reached from a Coder workspace.
base_url = "http://backend:8080/api/v1"
# Public half of the key pair the Hub signs user tokens with. A deployed custom component gets it mounted here.
# In a Coder workspace, copy it here (docs/coder.md). Template org-custom-component also sets HUB_PUBLIC_KEY_PATH to it.
public_key_path = "/etc/up-platform/jwt/public.pem"
# Credentials of this mini-app, given once by the organisation admin who registers it.
app_uuid = ""
client_secret = ""

[cors]
# Browser origins allowed in production. Local hosts are allowed automatically
# when environment = "development".
allowed_origins = []
